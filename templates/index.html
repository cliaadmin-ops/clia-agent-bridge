<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIA Agent Switchboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 180px);
        }
        .message-user {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
        }
        .message-agent {
            background-color: #f3f4f6;
            color: #1f2937;
            align-self: flex-start;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto max-w-4xl p-4">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-blue-900">CLIA Agent Switchboard</h1>
                <p class="text-sm text-gray-600">Local-First Website Management</p>
            </div>
            <div class="text-right">
                <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded text-green-600 bg-green-200 uppercase last:mr-0 mr-1">
                    System Active
                </span>
            </div>
        </header>

        <main class="bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Chat History -->
            <div id="chat-history" class="chat-container overflow-y-auto p-4 flex flex-col space-y-4">
                <div class="message-agent p-3 rounded-lg max-w-[80%]">
                    Hello! I'm the CLIA Agent. How can I help you manage the website today? You can ask me questions about the board, or upload meeting minutes to stage updates.
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 border-t border-gray-200 bg-gray-50">
                <form hx-post="/agent/chat" 
                      hx-target="#chat-history" 
                      hx-swap="beforeend" 
                      hx-on::after-request="this.reset()"
                      enctype="multipart/form-data"
                      class="flex flex-col space-y-2">
                    
                    <div class="flex space-x-2">
                        <textarea name="message" placeholder="Type your request here... (Shift+Enter for new line)" 
                                  rows="1"
                                  class="flex-grow p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none overflow-hidden"
                                  onkeydown="if(event.keyCode == 13 && !event.shiftKey) { event.preventDefault(); this.form.dispatchEvent(new Event('submit', {cancelable: true})); }"></textarea>
                        
                        <label class="cursor-pointer bg-gray-200 hover:bg-gray-300 p-2 rounded-md transition duration-200 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.414a4 4 0 00-5.656-5.656l-6.415 6.414a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                            <input type="file" name="file" class="hidden" onchange="document.getElementById('file-name').textContent = this.files[0].name">
                        </label>

                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition duration-200">
                            Send
                        </button>
                    </div>
                    <div id="file-name" class="text-xs text-gray-500 italic"></div>
                </form>
            </div>
        </main>
        
        <footer class="mt-4 text-center text-xs text-gray-500">
            CLIA Agent Bridge v1.0 | Powered by Local-First AI
        </footer>
    </div>

    <script>
        // Auto-scroll to bottom of chat history
        const chatHistory = document.getElementById('chat-history');
        const observer = new MutationObserver(() => {
            chatHistory.scrollTop = chatHistory.scrollHeight;
            // Save to localStorage whenever chat changes
            localStorage.setItem('clia_chat_history', chatHistory.innerHTML);
        });
        observer.observe(chatHistory, { childList: true });

        // Restore from localStorage on load
        window.addEventListener('load', () => {
            const savedHistory = localStorage.getItem('clia_chat_history');
            if (savedHistory) {
                chatHistory.innerHTML = savedHistory;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        });
    </script>
</body>
</html>
